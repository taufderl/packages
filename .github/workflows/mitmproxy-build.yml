# Self-contained CI for the mitmproxy package series on this fork.
# Lives only on the ci/** branch, so master and the submission branch stay clean.
# Builds the series with the OpenWrt SDK for arm_cortex-a7 (prebuilt toolchain,
# no kernel/device build) on GitHub runners. The Rust host toolchain is built
# once and cached; later runs are fast.
name: mitmproxy build (fork CI)

on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mitmproxy-build
  cancel-in-progress: true

env:
  TARGET_PATH: sunxi/cortexa7
  FEED: ${{ github.workspace }}/packages-feed

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget curl xz-utils zstd bzip2 patch perl time libelf-dev ccache

      - name: Check out this feed
        uses: actions/checkout@v4
        with:
          path: packages-feed

      - name: Download the OpenWrt SDK
        run: |
          base="https://downloads.openwrt.org/snapshots/targets/$TARGET_PATH"
          sdk=$(curl -fsS "$base/" | grep -oE 'openwrt-sdk-[^"]*\.tar\.(zst|xz)' | head -1)
          echo "SDK=$sdk"
          curl -fsSLO "$base/$sdk"
          case "$sdk" in
            *.zst) tar --zstd -xf "$sdk" ;;
            *)     tar -xf "$sdk" ;;
          esac
          rm -f "$sdk"
          mv openwrt-sdk-*/ sdk
          echo "SDK_ID=${sdk%.tar.*}" >> "$GITHUB_ENV"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: Restore host/toolchain cache (incl. Rust)
        uses: actions/cache@v4
        with:
          path: sdk/staging_dir/host
          key: host-${{ env.SDK_ID }}-${{ github.run_id }}
          restore-keys: host-${{ env.SDK_ID }}-

      - name: Configure feeds
        working-directory: sdk
        run: |
          sed -i "s#^src-git packages .*#src-link packages $FEED#" feeds.conf.default
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo 'CONFIG_PACKAGE_mitmproxy=m' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          grep -q 'CONFIG_PACKAGE_mitmproxy=m' .config

      - name: Download sources
        working-directory: sdk
        run: make -j8 package/mitmproxy/download V=s

      - name: Build mitmproxy and dependencies
        working-directory: sdk
        run: make -j"$(nproc)" package/mitmproxy/compile || make -j1 V=s package/mitmproxy/compile

      - name: Collect packages
        run: |
          mkdir -p out
          find sdk/bin/packages -name '*.apk' \( -path '*mitmproxy*' -o -name 'python3-*' \) -exec cp {} out/ \;
          echo "== built packages:"; ls -la out
          test -n "$(ls out/*.apk 2>/dev/null)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-arm_cortex-a7
          path: out/
